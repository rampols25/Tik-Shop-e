<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product · Tik & Shop-e</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --orange:#ee4d2d;--orange-dark:#d73211;--orange-pale:#fff2ef;
      --shopee-yellow:#ffcf24;--dark:#333;--text:#222;--muted:#888;
      --light:#f5f5f5;--border:#e8e8e8;--green:#26aa99;
      --shadow:0 2px 12px rgba(0,0,0,0.08);--radius:8px;
    }
    body{font-family:'Nunito',sans-serif;background:#f5f5f5;color:var(--text);min-height:100vh}

    /* ── TOPBAR ── */
    .topbar{background:linear-gradient(135deg,#ee4d2d,#ff6633);padding:12px 0}
    .topbar-inner{max-width:700px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
    .back-btn{width:36px;height:36px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none;transition:background .2s}
    .back-btn:hover{background:rgba(255,255,255,0.35)}
    .back-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.5}
    .topbar-title{color:white;font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-brand{color:rgba(255,255,255,0.7);font-size:12px;font-weight:600;white-space:nowrap}

    /* ── PRODUCT DETAIL CARD ── */
    .page-wrap{max-width:700px;margin:0 auto;padding:16px 16px 120px}

    .product-main{background:white;border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}

    /* Image gallery */
    .img-gallery{position:relative;background:#f9f9f9}
    .img-main{width:100%;aspect-ratio:1;object-fit:cover;display:block}
    .img-main-placeholder{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#f0f0f0}
    .img-main-placeholder svg{width:80px;height:80px;opacity:.15}
    .img-badge-wrap{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px}
    .img-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:4px}
    .img-badge.sale{background:var(--orange);color:white}
    .img-badge.hot{background:var(--shopee-yellow);color:#333}

    /* Product info */
    .product-info{padding:16px}
    .product-name-big{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--dark);line-height:1.4;margin-bottom:8px}
    .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
    .price-big{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;color:var(--orange)}
    .price-orig{font-size:14px;color:var(--muted);text-decoration:line-through}
    .price-disc{background:var(--orange-pale);color:var(--orange);font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
    .meta-row{display:flex;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:12px}
    .meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
    .meta-item svg{width:14px;height:14px;stroke:var(--orange);fill:none;stroke-width:2}
    .meta-stars{color:var(--orange);font-size:13px}
    .product-desc{font-size:14px;color:#555;line-height:1.7;margin-bottom:16px}

    /* Buy buttons */
    .buy-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .buy-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:6px;font-size:14px;font-weight:700;text-decoration:none;transition:all .2s;font-family:'Nunito',sans-serif;border:none;cursor:pointer}
    .buy-btn.tiktok{background:#010101;color:white}
    .buy-btn.tiktok:hover{background:#222}
    .buy-btn.shopee{background:var(--orange);color:white}
    .buy-btn.shopee:hover{background:var(--orange-dark)}

    /* ── SHARE SECTION ── */
    .share-section{background:white;border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
    .share-heading{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:var(--dark);margin-bottom:6px;display:flex;align-items:center;gap:8px}
    .share-heading::before{content:'';width:4px;height:20px;background:var(--orange);border-radius:2px;display:inline-block}
    .share-sub{font-size:13px;color:var(--muted);margin-bottom:18px}

    .share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .share-option{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:12px 6px;border-radius:10px;transition:background .2s;border:1.5px solid transparent}
    .share-option:hover{background:var(--orange-pale);border-color:rgba(238,77,45,0.15)}
    .share-option:active{transform:scale(0.95)}
    .share-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center}
    .share-icon.fb{background:#1877f2}
    .share-icon.messenger{background:linear-gradient(135deg,#0078ff,#a334fa,#ff4e83)}
    .share-icon.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
    .share-icon.twitter{background:#000}
    .share-icon.whatsapp{background:#25d366}
    .share-icon.telegram{background:#2ca5e0}
    .share-icon.viber{background:#7360f2}
    .share-icon.link{background:#f0f0f0;border:1px solid #e0e0e0}
    .share-label{font-size:11px;color:var(--dark);font-weight:700;text-align:center}

    /* Copy link bar */
    .copy-bar-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
    .copy-bar{display:flex;gap:0;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:white}
    .copy-bar-url{flex:1;padding:12px 14px;font-size:12px;color:var(--muted);background:var(--light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Nunito',sans-serif}
    .copy-bar-btn{background:var(--orange);color:white;border:none;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;transition:background .2s}
    .copy-bar-btn:hover{background:var(--orange-dark)}
    .copy-bar-btn.copied{background:var(--green)}

    /* Native share button */
    .native-share-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;background:var(--orange);color:white;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:12px;transition:background .2s}
    .native-share-btn:hover{background:var(--orange-dark)}
    .native-share-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.5}

    /* ── RELATED HINT ── */
    .related-hint{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;transition:box-shadow .2s}
    .related-hint:hover{box-shadow:0 4px 20px rgba(0,0,0,0.12)}
    .related-hint svg{width:20px;height:20px;stroke:var(--orange);fill:none;stroke-width:2;flex-shrink:0}
    .related-hint-text{flex:1;font-size:14px;font-weight:600;color:var(--dark)}
    .related-hint-arrow{font-size:20px;color:var(--orange)}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:white;font-size:13px;font-weight:700;padding:10px 22px;border-radius:24px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;white-space:nowrap}
    .toast.show{opacity:1}

    /* ── STICKY BUY BAR ── */
    .sticky-buy{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1.5px solid var(--border);padding:10px 16px;display:flex;gap:10px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
    .sticky-buy a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:6px;font-size:13px;font-weight:700;text-decoration:none;transition:all .2s}
    .sticky-buy a.tiktok{background:#010101;color:white}
    .sticky-buy a.shopee{background:var(--orange);color:white}
    .sticky-buy a:hover{opacity:.9}
    .sticky-buy .share-quick{width:44px;flex:none;background:var(--orange-pale);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;border:1.5px solid rgba(238,77,45,0.2)}
    .sticky-buy .share-quick:hover{background:var(--orange)}
    .sticky-buy .share-quick:hover svg{stroke:white}
    .sticky-buy .share-quick svg{width:18px;height:18px;stroke:var(--orange);fill:none;stroke-width:2.5;transition:stroke .2s}

    /* ── NOT FOUND ── */
    .not-found{text-align:center;padding:60px 24px}
    .not-found svg{width:64px;height:64px;opacity:.3;margin-bottom:16px}
    .not-found h2{font-size:20px;font-weight:700;color:var(--dark);margin-bottom:8px}
    .not-found p{font-size:14px;color:var(--muted);margin-bottom:20px}
    .not-found a{display:inline-block;background:var(--orange);color:white;padding:12px 28px;border-radius:6px;font-weight:700;text-decoration:none;font-size:14px}
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="topbar-title" id="topbar-title">Product</div>
    <div class="topbar-brand" id="topbar-brand">Tik & Shop-e</div>
  </div>
</header>

<div class="page-wrap" id="page-wrap">
  <!-- Rendered by JS -->
</div>

<!-- STICKY BUY BAR -->
<div class="sticky-buy" id="sticky-buy" style="display:none">
  <a href="#" id="sb-tiktok" class="tiktok" target="_blank">▶ TikTok</a>
  <a href="#" id="sb-shopee" class="shopee" target="_blank">🛍 Shopee</a>
  <div class="share-quick" onclick="scrollToShare()" title="Share">
    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">✓ Link copied!</div>

<script>
// ─────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────
function getData(){
  try{
    const s = localStorage.getItem('tikshope_data');
    if(s) return JSON.parse(s);
  }catch(e){}
  return {
    brand:'Tik & Shop-e',
    products:[
      {name:'Your Product Name',desc:'Short description here.',price:'000',orig:'000',image:'',tiktokUrl:'',shopeeUrl:'',badge:'Best Seller'},
      {name:'Another Product',desc:'Short description here.',price:'000',orig:'000',image:'',tiktokUrl:'',shopeeUrl:'',badge:'New Arrival'}
    ]
  };
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const productId = parseInt(params.get('id') || '0', 10);
const autoShare = params.get('share') === '1';

const storeData = getData();
const product = (storeData.products || [])[productId];
const brand = storeData.brand || 'Tik & Shop-e';

document.getElementById('topbar-brand').textContent = brand;

if(!product){
  document.getElementById('page-wrap').innerHTML = `
    <div class="not-found">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <h2>Product not found</h2>
      <p>This product doesn't exist or may have been removed.</p>
      <a href="index.html">← Back to Store</a>
    </div>`;
} else {
  renderProduct(product);
}

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
function renderProduct(p){
  document.title = p.name + ' · ' + brand;
  document.getElementById('topbar-title').textContent = p.name;

  const disc = p.orig && p.price ? Math.round((1 - parseFloat(p.price)/parseFloat(p.orig))*100) : 0;
  const shareUrl = p.shopeeUrl || p.tiktokUrl || window.location.href;
  const shareText = `🛍️ ${p.name} — Only ₱${p.price}! Check it out:`;

  document.getElementById('page-wrap').innerHTML = `

    <!-- PRODUCT MAIN -->
    <div class="product-main">
      <div class="img-gallery">
        ${p.image
          ? `<img class="img-main" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`
          : `<div class="img-main-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`
        }
        <div class="img-badge-wrap">
          <span class="img-badge sale">${p.badge || 'Best Seller'}</span>
          ${disc > 0 ? `<span class="img-badge hot">-${disc}% OFF</span>` : ''}
        </div>
      </div>

      <div class="product-info">
        <div class="product-name-big">${p.name}</div>

        <div class="price-row">
          <span class="price-big">₱ ${p.price}</span>
          ${p.orig ? `<span class="price-orig">₱ ${p.orig}</span>` : ''}
          ${disc > 0 ? `<span class="price-disc">-${disc}%</span>` : ''}
        </div>

        <div class="meta-row">
          <div class="meta-item">
            <span class="meta-stars">★★★★★</span>
            <span>4.9 (1K+ reviews)</span>
          </div>
          <div class="meta-item">
            <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
            1K+ sold
          </div>
          <div class="meta-item">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            Free shipping
          </div>
        </div>

        ${p.desc ? `<p class="product-desc">${p.desc}</p>` : ''}

        <div class="buy-btns">
          <a href="${p.tiktokUrl || '#'}" target="_blank" class="buy-btn tiktok">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.93a8.26 8.26 0 004.84 1.55V7.04a4.85 4.85 0 01-1.07-.35z"/></svg>
            Buy on TikTok
          </a>
          <a href="${p.shopeeUrl || '#'}" target="_blank" class="buy-btn shopee">
            🛍️ Buy on Shopee
          </a>
        </div>
      </div>
    </div>

    <!-- SHARE SECTION -->
    <div class="share-section" id="share-section">
      <div class="share-heading">Share This Product</div>
      <p class="share-sub">Share with friends and family on your favourite platform!</p>

      <div class="share-grid">
        <div class="share-option" onclick="shareTo('facebook')">
          <div class="share-icon fb"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg></div>
          <span class="share-label">Facebook</span>
        </div>
        <div class="share-option" onclick="shareTo('messenger')">
          <div class="share-icon messenger"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.15 2 11.26c0 2.83 1.3 5.36 3.35 7.08V22l3.07-1.69c.82.23 1.68.35 2.58.35 5.52 0 10-4.15 10-9.26C21 6.15 17.52 2 12 2zm1 12.48l-2.55-2.71-4.97 2.71 5.47-5.81 2.6 2.71 4.92-2.71-5.47 5.81z"/></svg></div>
          <span class="share-label">Messenger</span>
        </div>
        <div class="share-option" onclick="shareTo('whatsapp')">
          <div class="share-icon whatsapp"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
          <span class="share-label">WhatsApp</span>
        </div>
        <div class="share-option" onclick="shareTo('telegram')">
          <div class="share-icon telegram"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
          <span class="share-label">Telegram</span>
        </div>
        <div class="share-option" onclick="shareTo('viber')">
          <div class="share-icon viber"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
          <span class="share-label">Viber</span>
        </div>
        <div class="share-option" onclick="shareTo('twitter')">
          <div class="share-icon twitter"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
          <span class="share-label">Twitter / X</span>
        </div>
        <div class="share-option" onclick="shareTo('instagram')">
          <div class="share-icon ig"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
          <span class="share-label">Instagram</span>
        </div>
        <div class="share-option" onclick="copyLink()">
          <div class="share-icon link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div>
          <span class="share-label">Copy Link</span>
        </div>
      </div>

      <div class="copy-bar-label">Product Link</div>
      <div class="copy-bar">
        <div class="copy-bar-url" id="copy-url">${shareUrl}</div>
        <button class="copy-bar-btn" id="copy-btn" onclick="copyLink()">Copy</button>
      </div>

      ${typeof navigator.share !== 'undefined' ? `
      <button class="native-share-btn" onclick="nativeShare()">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Share via Phone
      </button>` : ''}
    </div>

    <!-- BACK TO STORE -->
    <a class="related-hint" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <div class="related-hint-text">See more products in the store</div>
      <span class="related-hint-arrow">›</span>
    </a>
  `;

  // Set sticky buy bar
  document.getElementById('sticky-buy').style.display = 'flex';
  document.getElementById('sb-tiktok').href = p.tiktokUrl || '#';
  document.getElementById('sb-shopee').href = p.shopeeUrl || '#';

  // Store for share functions
  window._currentProduct = p;
  window._shareUrl = shareUrl;
  window._shareText = shareText;

  // Auto-scroll to share if ?share=1
  if(autoShare){
    setTimeout(()=>{
      const el = document.getElementById('share-section');
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 300);
  }
}

// ─────────────────────────────────────────────────────────────
// SHARE FUNCTIONS
// ─────────────────────────────────────────────────────────────
function shareTo(platform){
  const url = encodeURIComponent(window._shareUrl || window.location.href);
  const text = encodeURIComponent(window._shareText || '');

  const links = {
    facebook:  `https://www.facebook.com/sharer/sharer.php?u=${url}`,
    messenger: /Mobi|Android|iPhone/i.test(navigator.userAgent)
               ? `fb-messenger://share?link=${url}`
               : `https://www.facebook.com/dialog/send?link=${url}&app_id=291494419107518&redirect_uri=${url}`,
    whatsapp:  `https://wa.me/?text=${text}%20${url}`,
    telegram:  `https://t.me/share/url?url=${url}&text=${text}`,
    viber:     `viber://forward?text=${text}%20${url}`,
    twitter:   `https://twitter.com/intent/tweet?text=${text}&url=${url}`,
    instagram: null   // no direct URL share API
  };

  if(platform === 'instagram'){
    copyLink();
    showToast('Link copied! Open Instagram and paste it.');
    setTimeout(()=> window.open('https://www.instagram.com/', '_blank'), 800);
    return;
  }

  const link = links[platform];
  if(link){
    if(platform === 'messenger' && /Mobi|Android|iPhone/i.test(navigator.userAgent)){
      window.location.href = link;
    } else {
      window.open(link, '_blank', 'width=620,height=450,noopener');
    }
  }
}

async function copyLink(){
  const url = window._shareUrl || window.location.href;
  try{
    await navigator.clipboard.writeText(url);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const btn = document.getElementById('copy-btn');
  if(btn){ btn.textContent = '✓ Copied!'; btn.classList.add('copied'); }
  showToast('✓ Link copied to clipboard!');
  setTimeout(()=>{
    if(btn){ btn.textContent = 'Copy'; btn.classList.remove('copied'); }
  }, 2500);
}

function nativeShare(){
  const p = window._currentProduct;
  if(!p) return;
  navigator.share({
    title: p.name,
    text: window._shareText,
    url: window._shareUrl || window.location.href
  }).catch(()=>{});
}

function scrollToShare(){
  const el = document.getElementById('share-section');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
