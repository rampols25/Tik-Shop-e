<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tik & Shop-e</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#b8973a;--gold-light:#d4af57;--dark:#0e0e0e;--cream:#f7f4ef;--text:#1a1a1a;--muted:#6b6660;--border:rgba(184,151,58,0.25)}
    body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--text)}
    .page{max-width:820px;margin:0 auto;padding:0 0 60px}

    .hero{background:var(--dark);color:white;padding:52px 32px 44px;text-align:center;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 60%,rgba(184,151,58,0.12),transparent)}
    .hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--gold-light);margin-bottom:18px;position:relative}
    .hero-title{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:600;line-height:1.12;margin-bottom:12px;color:#f5f0e8;position:relative}
    .hero-title em{font-style:italic;color:var(--gold-light)}
    .hero-sub{font-size:14px;font-weight:300;color:rgba(255,255,255,0.55);letter-spacing:1px;margin-bottom:28px;position:relative}
    .hero-cta{display:inline-block;background:var(--gold);color:#0e0e0e;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;padding:13px 32px;border:none;cursor:pointer;transition:background 0.2s;position:relative}
    .hero-cta:hover{background:var(--gold-light)}

    .sl{font-size:10px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
    .st{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--text);margin-bottom:6px}
    .ss{font-size:13px;color:var(--muted);font-weight:300;margin-bottom:24px}
    .divider{width:40px;height:1px;background:var(--gold);margin-bottom:28px}

    /* SHOP LINKS */
    .aff-section{background:white;padding:36px 32px;border-bottom:1px solid #ede8df}
    .aff-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .aff-card{border:1px solid var(--border);padding:24px;background:var(--cream);transition:border-color 0.2s;text-align:center}
    .aff-card:hover{border-color:var(--gold)}
    .aff-platform{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
    .aff-desc{font-size:13px;color:var(--muted);margin-bottom:18px;font-weight:300;line-height:1.6}
    .aff-btn{display:block;padding:12px;font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:all 0.2s;font-family:'Jost',sans-serif}
    .aff-btn.dark{background:var(--dark);color:white}
    .aff-btn.dark:hover{background:#2a2a2a}
    .aff-btn.gold{background:var(--gold);color:#0e0e0e}
    .aff-btn.gold:hover{background:var(--gold-light)}

    /* GALLERY */
    .media-section{padding:36px 32px;background:var(--cream);border-bottom:1px solid #ede8df}
    .media-tabs{display:flex;margin-bottom:24px;border-bottom:1px solid #e0dbd0}
    .media-tab{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:10px 18px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s}
    .media-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
    .media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .media-slot{aspect-ratio:1;background:white;border:1px solid #e0dbd0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .media-slot img{width:100%;height:100%;object-fit:cover}
    .media-slot-tag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;background:var(--gold);color:#0e0e0e;padding:3px 7px}
    .media-empty{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0.3}
    .media-empty svg{display:block}
    .media-empty span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500}
    .video-item{background:white;border:1px solid #e0dbd0;padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;transition:border-color 0.2s;margin-bottom:10px}
    .video-item:hover{border-color:var(--gold)}
    .video-title{font-size:13px;color:var(--muted);font-weight:300}
    .video-cta{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-left:auto;white-space:nowrap}

    /* PRODUCTS */
    .product-section{padding:36px 32px;background:white;border-bottom:1px solid #ede8df}
    .products-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .product-card{border:1px solid #e0dbd0;background:var(--cream);transition:border-color 0.2s;overflow:hidden}
    .product-card:hover{border-color:var(--gold)}
    .product-card-img{aspect-ratio:1;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .product-card-img img{width:100%;height:100%;object-fit:cover}
    .product-card-img .empty-img{opacity:0.15;text-align:center}
    .product-badge{display:inline-block;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;background:#faf4e8;color:var(--gold);border:1px solid var(--border);padding:3px 8px}
    .product-card-body{padding:16px}
    .product-card-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin:8px 0 6px}
    .product-card-desc{font-size:12px;color:var(--muted);font-weight:300;line-height:1.6;margin-bottom:12px}
    .product-card-price{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--gold);margin-bottom:14px}
    .product-card-price .orig{font-size:12px;font-family:'Jost',sans-serif;font-weight:300;color:var(--muted);margin-left:4px;text-decoration:line-through}
    .product-card-btns{display:flex;gap:8px}
    .btn-tiktok{flex:1;background:var(--dark);color:white;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:10px 8px;text-decoration:none;text-align:center;font-family:'Jost',sans-serif;transition:background 0.2s}
    .btn-tiktok:hover{background:#2a2a2a}
    .btn-shopee{flex:1;border:1px solid var(--border);color:var(--gold);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:10px 8px;text-decoration:none;text-align:center;font-family:'Jost',sans-serif;transition:all 0.2s}
    .btn-shopee:hover{background:var(--gold);color:#0e0e0e}

    /* REVIEWS */
    .review-section{padding:36px 32px;background:var(--cream);border-bottom:1px solid #ede8df}
    .review-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .review-card{background:white;border:1px solid #e0dbd0;padding:20px}
    .review-stars{color:var(--gold);font-size:12px;letter-spacing:2px;margin-bottom:10px}
    .review-text{font-size:13px;color:var(--muted);font-weight:300;line-height:1.7;font-style:italic;margin-bottom:12px}
    .review-author{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--text)}
    .review-via{font-size:10px;color:var(--gold);letter-spacing:1px}

    /* STEPS */
    .steps-section{padding:36px 32px;background:white;border-bottom:1px solid #ede8df}
    .steps-row{display:flex}
    .step{flex:1;padding:20px 16px;position:relative;text-align:center}
    .step:not(:last-child)::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:1px;height:40%;background:var(--border)}
    .step-num{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--gold);opacity:0.5;margin-bottom:8px}
    .step-title{font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
    .step-desc{font-size:12px;color:var(--muted);font-weight:300;line-height:1.6}

    /* FOOTER */
    .footer-cta{background:var(--dark);padding:40px 32px;text-align:center}
    .footer-cta h3{font-family:'Cormorant Garamond',serif;font-size:28px;color:#f5f0e8;font-weight:600;margin-bottom:8px}
    .footer-cta p{font-size:13px;color:rgba(255,255,255,0.45);font-weight:300;margin-bottom:24px;letter-spacing:1px}
    .footer-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
    .footer-link{display:inline-block;font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;padding:12px 24px;border:1px solid rgba(184,151,58,0.4);color:var(--gold-light);text-decoration:none;transition:all 0.2s}
    .footer-link:hover{background:var(--gold);color:#0e0e0e;border-color:var(--gold)}
    .footer-link.primary{background:var(--gold);color:#0e0e0e;border-color:var(--gold)}
    .footer-link.primary:hover{background:var(--gold-light)}
    .footer-bottom{margin-top:32px;font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:2px;text-transform:uppercase}

    @media(max-width:600px){
      .aff-grid,.products-grid,.review-grid{grid-template-columns:1fr}
      .steps-row{flex-direction:column}
      .step:not(:last-child)::after{display:none}
      .hero-title{font-size:32px}
      .media-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
<div class="page" id="page-root">
  <!-- Content is loaded from data.json via JavaScript -->
</div>

<script>
// Load data saved by admin panel
async function loadPage() {
  let data = getDefaultData();
  try {
    const saved = localStorage.getItem('tikshope_data');
    if (saved) data = JSON.parse(saved);
  } catch(e) {}
  renderPage(data);
}

function getDefaultData() {
  return {
    brand: 'Tik & Shop-e',
    subtitle: 'Handpicked deals · Fast shipping · Trusted by thousands',
    tiktokUrl: '#',
    shopeeUrl: '#',
    photos: ['','','','','',''],
    videos: [
      {title:'TikTok Video 1 — Watch & Shop', url:'#'},
      {title:'TikTok Video 2 — Watch & Shop', url:'#'},
      {title:'TikTok Video 3 — Watch & Shop', url:'#'}
    ],
    products: [
      {name:'Your Product Name', desc:'Short description here. Highlight benefits and why customers need it.', price:'000', orig:'000', image:'', tiktokUrl:'#', shopeeUrl:'#', badge:'Best Seller'},
      {name:'Another Product', desc:'Short description here. Highlight benefits and why customers need it.', price:'000', orig:'000', image:'', tiktokUrl:'#', shopeeUrl:'#', badge:'New Arrival'}
    ],
    reviews: [
      {text:'"Add a real customer review here. Mention what they bought and why they loved it."', author:'Customer Name', via:'via TikTok Shop'},
      {text:'"Paste another customer review here. Screenshots from Shopee or TikTok work great."', author:'Customer Name', via:'via Shopee'},
      {text:'"A third review builds trust. Real buyer feedback converts best."', author:'Customer Name', via:'via TikTok Shop'}
    ]
  };
}

function imgSlot(src, tag) {
  if (src && src.trim() !== '') {
    return `<div class="media-slot">${tag ? `<div class="media-slot-tag">${tag}</div>` : ''}<img src="${src}" alt="Product"/></div>`;
  }
  return `<div class="media-slot"><div class="media-empty"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Photo</span></div></div>`;
}

function renderPage(d) {
  document.title = d.brand;
  document.getElementById('page-root').innerHTML = `
    <div class="hero">
      <div class="hero-eyebrow">${d.brand}</div>
      <h1 class="hero-title">Discover <em>Curated</em><br>Premium Finds</h1>
      <p class="hero-sub">${d.subtitle}</p>
      <button class="hero-cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button>
    </div>

    <div class="aff-section">
      <div class="sl">Shop With Us</div>
      <div class="st">Find Us On Your Favorite Platform</div>
      <p class="ss">Tap below to visit our official store and get exclusive deals</p>
      <div class="divider"></div>
      <div class="aff-grid">
        <div class="aff-card">
          <div class="aff-platform">TikTok Shop</div>
          <p class="aff-desc">Watch our product demos, follow us, and shop directly through TikTok.</p>
          <a href="${d.tiktokUrl}" target="_blank" class="aff-btn dark">Visit TikTok Shop</a>
        </div>
        <div class="aff-card">
          <div class="aff-platform">Shopee Affiliate</div>
          <p class="aff-desc">Browse our full catalog on Shopee with ratings, reviews & fast delivery.</p>
          <a href="${d.shopeeUrl}" target="_blank" class="aff-btn gold">Visit Shopee Store</a>
        </div>
      </div>
    </div>

    <div class="media-section">
      <div class="sl">Content Gallery</div>
      <div class="st">See It In Action</div>
      <p class="ss">Product photos and video previews</p>
      <div class="divider"></div>
      <div class="media-tabs">
        <div class="media-tab active" onclick="switchTab(this,'photos')">Photos</div>
        <div class="media-tab" onclick="switchTab(this,'videos')">Videos</div>
      </div>
      <div id="photos-panel">
        <div class="media-grid">
          ${d.photos.map((p,i) => imgSlot(p, i===0 ? 'Featured' : '')).join('')}
        </div>
      </div>
      <div id="videos-panel" style="display:none">
        ${d.videos.map(v => `<a href="${v.url}" target="_blank" class="video-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b8973a" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg><span class="video-title">${v.title}</span><span class="video-cta">Watch & Shop</span></a>`).join('')}
      </div>
    </div>

    <div class="product-section" id="products">
      <div class="sl">Our Products</div>
      <div class="st">Today's Best Deals</div>
      <p class="ss">Hand-selected picks — limited stocks only</p>
      <div class="divider"></div>
      <div class="products-grid">
        ${d.products.map(p => `
        <div class="product-card">
          <div class="product-card-img">
            ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none'"/>` : `<div class="empty-img"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`}
          </div>
          <div class="product-card-body">
            <span class="product-badge">${p.badge || 'Best Seller'}</span>
            <div class="product-card-name">${p.name}</div>
            <p class="product-card-desc">${p.desc}</p>
            <div class="product-card-price">₱ ${p.price} <span class="orig">₱ ${p.orig}</span></div>
            <div class="product-card-btns">
              <a href="${p.tiktokUrl}" target="_blank" class="btn-tiktok">TikTok</a>
              <a href="${p.shopeeUrl}" target="_blank" class="btn-shopee">Shopee</a>
            </div>
          </div>
        </div>`).join('')}
      </div>
    </div>

    <div class="review-section">
      <div class="sl">Social Proof</div>
      <div class="st">What Our Customers Say</div>
      <div class="divider"></div>
      <div class="review-grid">
        ${d.reviews.map(r => `
        <div class="review-card">
          <div class="review-stars">★★★★★</div>
          <p class="review-text">${r.text}</p>
          <div class="review-author">${r.author}</div>
          <div class="review-via">${r.via}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="steps-section">
      <div class="sl">Easy Steps</div>
      <div class="st">How To Order</div>
      <div class="divider"></div>
      <div class="steps-row">
        <div class="step"><div class="step-num">01</div><div class="step-title">Browse</div><p class="step-desc">Click any product link to view full details on TikTok Shop or Shopee.</p></div>
        <div class="step"><div class="step-num">02</div><div class="step-title">Add to Cart</div><p class="step-desc">Select your variant and add to your cart on the platform.</p></div>
        <div class="step"><div class="step-num">03</div><div class="step-title">Checkout</div><p class="step-desc">Pay securely — GCash, card, COD, or ShopeePay accepted.</p></div>
        <div class="step"><div class="step-num">04</div><div class="step-title">Delivered</div><p class="step-desc">Track your package and receive it straight to your door!</p></div>
      </div>
    </div>

    <div class="footer-cta">
      <h3>${d.brand}</h3>
      <p>Browse exclusive deals updated daily · Free shipping available</p>
      <div class="footer-links">
        <a class="footer-link primary" href="${d.tiktokUrl}" target="_blank">Shop on TikTok</a>
        <a class="footer-link" href="${d.shopeeUrl}" target="_blank">Shop on Shopee</a>
      </div>
      <div class="footer-bottom">© 2025 ${d.brand} · Affiliate links may earn commission</div>
    </div>
  `;
}

function switchTab(el, panel) {
  document.querySelectorAll('.media-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('photos-panel').style.display = panel === 'photos' ? 'block' : 'none';
  document.getElementById('videos-panel').style.display = panel === 'videos' ? 'block' : 'none';
}

loadPage();
</script>
</body>
</html>
